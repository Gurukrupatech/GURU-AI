<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURU AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#02070a;color:#fff;
 font-family:Arial,sans-serif;
}
.app{
 min-height:100vh;padding:15px;
 background:
 radial-gradient(circle at 70% 35%,#064b45,transparent 30%),
 linear-gradient(160deg,#071217,#020506);
}
header{
 display:flex;align-items:center;justify-content:space-between;
 padding:10px;border-bottom:1px solid #00ffc855;
}
.logo{
 width:48px;height:48px;border:2px solid #00eaff;
 border-radius:50%;display:grid;place-items:center;
 color:#00ff88;font-size:25px;
 box-shadow:0 0 20px #00eaff;
}
.brand{display:flex;gap:12px;align-items:center}
h1{margin:0;font-size:24px;letter-spacing:2px}
h1 span{color:#00eaff}
small{color:#00ff88;letter-spacing:3px}
button{
 cursor:pointer;color:white;background:#071519;
 border:1px solid #00eaff;border-radius:12px;
 padding:12px;font-weight:bold;
}
.gear{font-size:22px;background:#00ff73;color:#00100a}

.card{
 margin-top:15px;padding:15px;
 border:1px solid #00eaff77;border-radius:18px;
 background:#031014dd;
 box-shadow:0 0 20px #00eaff12;
}
.trans{border-color:#00ff88}
.label{color:#00ff88;font-size:11px;font-weight:bold}
.text{margin-top:8px;font-size:15px;line-height:1.4}

.main{
 display:grid;grid-template-columns:150px 1fr;
 align-items:center;gap:10px;margin-top:12px;
}
.menu{display:flex;flex-direction:column;gap:10px}
.menu button{text-align:left}
.memory{border-color:#00eaff;color:#00eaff}
.chat{border-color:#ff8426;color:#ff8426}
.soul{border-color:white}
.settings{border-color:#00ff88;color:#00ff88}

.globe{
 height:280px;display:grid;place-items:center;
 position:relative;
}
.globeCircle{
 width:210px;height:210px;border:2px solid #00eaff;
 border-radius:50%;
 box-shadow:0 0 35px #00eaff55,inset 0 0 30px #00eaff22;
 position:relative;
 animation:rotate 8s linear infinite;
}
.globeCircle:before,
.globeCircle:after{
 content:"";position:absolute;inset:15px;
 border:1px solid #00ffbb88;border-radius:50%;
}
.globeCircle:after{
 transform:rotate(65deg) scaleX(.45);
}
@keyframes rotate{
 to{transform:rotateY(360deg)}
}
.speaking{
 position:absolute;bottom:5px;
 color:#00ff88;font-size:10px;
 letter-spacing:3px;font-weight:bold;
}

.controls{
 display:flex;justify-content:flex-end;gap:8px;
}
.stop{border-color:#ff2694}
.sound{border-color:#00eaff}

.grid{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;
}
.news,.task{
 padding:8px 0;font-size:12px;
 border-bottom:1px solid #ffffff18;
}
.blue{color:#00eaff}
.green{color:#00ff88}

.bottom{
 display:grid;grid-template-columns:1fr 90px 1fr;
 align-items:center;margin-top:15px;
}
.mic{
 width:75px;height:75px;border-radius:50%;
 margin:auto;font-size:28px;
 border:2px solid #00ff88;
 box-shadow:0 0 25px #00ff8844;
}
.mic.on{
 border-color:#ff299b;
 box-shadow:0 0 30px #ff299b;
}
.creator{
 text-align:center;color:#00eaff;
 font-size:10px;letter-spacing:2px;margin-top:10px;
}

.overlay{
 position:fixed;inset:0;background:#000c;
 display:none;align-items:center;justify-content:center;
 padding:15px;z-index:10;
}
.modal{
 width:100%;max-width:500px;max-height:90vh;
 overflow:auto;background:#061116;
 border:1px solid #00eaff;border-radius:20px;
 padding:18px;
}
.overlay.show{display:flex}
.modal h2{color:#00eaff}
.field{margin:15px 0}
.field label{display:block;margin-bottom:7px;color:#00ff88}
input,select{
 width:100%;padding:11px;
 border-radius:10px;
 background:#02090c;color:white;
 border:1px solid #27616b;
}
.save{width:100%;margin-top:10px;background:#00ef82;color:#00100a}
.close{float:right}
.chatbox{max-height:45vh;overflow:auto}
.bubble{
 padding:10px;margin:8px 0;border-radius:12px;
 background:#06252b;border:1px solid #00eaff55;
}
.user{border-color:#00ff8855}
.chatinput{display:flex;gap:6px}
.chatinput input{flex:1}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="brand">
  <div class="logo">◉</div>
  <div>
   <h1>GURU <span>AI</span></h1>
   <small>SMART ASSISTANT</small>
  </div>
 </div>
 <button class="gear" onclick="openSettings()">⚙</button>
</header>

<div class="card trans">
 <div class="label">TRANSCRIPT</div>
 <div style="margin-top:12px">
  <b class="green">GURU AI</b>
  <div class="text" id="aiText">
   Hello Boss! 😊 Main GURU AI hoon. Aaj kay help karu?
  </div>
 </div>
 <div style="margin-top:12px">
  <b class="green">YOU</b>
  <div class="text" id="userText">Hello Boss!</div>
 </div>
</div>

<div class="main">

<div class="menu">
 <button class="memory" onclick="openMemory()">✦ MEMORY</button>
 <button class="chat" onclick="openChat()">▣ CHAT</button>
 <button class="soul" onclick="openSoul()">✧ SOUL</button>
 <button class="settings" onclick="openSettings()">⚙ SETTINGS</button>
</div>

<div>
 <div class="globe">
  <div class="globeCircle"></div>
  <div class="speaking" id="state">READY</div>
 </div>

 <div class="controls">
  <button class="stop" onclick="stopVoice()">■ STOP</button>
  <button class="sound" onclick="speak(document.getElementById('aiText').innerText)">🔊</button>
 </div>
</div>

</div>

<div class="grid">

<div class="card">
 <b class="blue">TODAY HEADLINES ›</b>
 <div class="news">🔹 AI News Today</div>
 <div class="news">🔹 Technology Updates</div>
 <div class="news">🔹 World News</div>
 <div class="news">🔹 Business News</div>
 <div class="green">+1 MORE</div>
</div>

<div class="card">
 <b>TODAY TASKS 2/4 🔥 ›</b>
 <div style="margin-top:15px;background:#07333b;height:8px;border-radius:8px">
  <div style="width:55%;height:100%;background:#00eaff;border-radius:8px"></div>
 </div>
 <div class="task">✓ Release desktop version</div>
 <div class="task">✓ Upload video</div>
</div>

</div>

<div class="bottom">
 <button onclick="speak(document.getElementById('aiText').innerText)">♬<br>VOICE</button>

 <button class="mic" id="mic" onclick="startMic()">🎙</button>

 <button onclick="openSettings()">⚙<br>SETTINGS</button>
</div>

<div class="creator">CREATE BY SHIV SONUNE</div>

</div>

<div class="overlay" id="overlay">
 <div class="modal" id="modal"></div>
</div>

<script>

let settings=JSON.parse(localStorage.getItem("guruSettings")||"null")||{
 language:"Marathi",
 speed:.92,
 pitch:1.15,
 volume:1,
 autoSpeak:true
};

let voices=[];

function loadVoices(){
 voices=speechSynthesis.getVoices();
}
loadVoices();
speechSynthesis.onvoiceschanged=loadVoices;

function getVoice(lang){

 let short=lang.split("-")[0];

 return voices.find(v=>
  v.lang.toLowerCase().startsWith(short) &&
  /female|zira|samantha|heera|neerja|veena|google|microsoft/i.test(v.name)
 )
 ||
 voices.find(v=>
  v.lang.toLowerCase().startsWith(short)
 );
}

function speak(text){

 if(!("speechSynthesis" in window)){
  alert("Voice support nahi. Chrome browser use kara.");
  return;
 }

 speechSynthesis.cancel();

 let lang=
  settings.language==="Marathi"?"mr-IN":
  settings.language==="Hindi"?"hi-IN":"en-IN";

 let u=new SpeechSynthesisUtterance(text);

 u.lang=lang;
 u.rate=settings.speed;
 u.pitch=settings.pitch;
 u.volume=settings.volume;

 let voice=getVoice(lang);
 if(voice)u.voice=voice;

 u.onstart=()=>{
  document.getElementById("state").innerText="SPEAKING";
 };

 u.onend=()=>{
  document.getElementById("state").innerText="READY";
 };

 u.onerror=()=>{
  document.getElementById("state").innerText="READY";
 };

 speechSynthesis.speak(u);
}

function stopVoice(){
 speechSynthesis.cancel();
 document.getElementById("state").innerText="STOPPED";
}

function answer(q){

 q=q.toLowerCase();

 if(q.includes("hello")||q.includes("hi")||q.includes("hey"))
 return "Hello Boss! 😊 Chhan vatla tumhi aalat. Sang na, aaj kay karaycha aahe?";

 if(q.includes("trading"))
 return "Ho Boss 😊 Trading mi tumhala simple ani step by step samjavun sangte.";

 if(q.includes("who are"))
 return "Mi GURU AI aahe — GurukrupaTech cha friendly smart AI assistant.";

 return "Ho Boss 😊 Samajla. Sang na, nemka kay help pahije? Mi friendly way ne help karte.";
}

function reply(text){

 document.getElementById("userText").innerText=text;

 let ans=answer(text);

 document.getElementById("aiText").innerText=ans;

 if(settings.autoSpeak)speak(ans);
}

function startMic(){

 const SpeechRecognition=
 window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  alert("Chrome browser madhye microphone use kara.");
  return;
 }

 let r=new SpeechRecognition();

 r.lang=
 settings.language==="Marathi"?"mr-IN":
 settings.language==="Hindi"?"hi-IN":"en-IN";

 r.continuous=false;
 r.interimResults=false;

 let mic=document.getElementById("mic");

 r.onstart=()=>{
  mic.classList.add("on");
  document.getElementById("state").innerText="LISTENING";
 };

 r.onresult=e=>{
  reply(e.results[0][0].transcript);
 };

 r.onerror=()=>{
  alert("Microphone permission allow kara.");
 };

 r.onend=()=>{
  mic.classList.remove("on");
  document.getElementById("state").innerText="READY";
 };

 r.start();
}

function showModal(html){
 document.getElementById("modal").innerHTML=html;
 document.getElementById("overlay").classList.add("show");
}

function closeModal(){
 document.getElementById("overlay").classList.remove("show");
}

function openSettings(){

 showModal(`
 <button class="close" onclick="closeModal()">✕</button>
 <h2>GURU AI CONTROL CENTER</h2>

 <div class="field">
 <label>Language</label>
 <select id="language">
  <option>Marathi</option>
  <option>Hindi</option>
  <option>English</option>
 </select>
 </div>

 <div class="field">
 <label>Voice Speed</label>
 <input id="speed" type="range" min=".75" max="1.15" step=".01" value="${settings.speed}">
 </div>

 <div class="field">
 <label>Voice Pitch</label>
 <input id="pitch" type="range" min=".9" max="1.3" step=".01" value="${settings.pitch}">
 </div>

 <div class="field">
 <label>Volume</label>
 <input id="volume" type="range" min="0" max="1" step=".05" value="${settings.volume}">
 </div>

 <div class="field">
 <label>Auto Speak
 <input id="auto" type="checkbox" ${settings.autoSpeak?"checked":""}>
 </label>
 </div>

 <button class="save" onclick="saveSettings()">SAVE SETTINGS</button>

 <button class="save" onclick="testVoice()" style="background:#00eaff">
 TEST FRIENDLY VOICE
 </button>
 `);

 document.getElementById("language").value=settings.language;
}

function saveSettings(){

 settings={
  language:document.getElementById("language").value,
  speed:+document.getElementById("speed").value,
  pitch:+document.getElementById("pitch").value,
  volume:+document.getElementById("volume").value,
  autoSpeak:document.getElementById("auto").checked
 };

 localStorage.setItem("guruSettings",JSON.stringify(settings));

 closeModal();
}

function testVoice(){

 let t=
 settings.language==="Marathi"
 ?"Hello Boss! 😊 Mi GURU AI aahe. Tumhala help karayla mi ready aahe."
 :settings.language==="Hindi"
 ?"Hello Boss! 😊 Main GURU AI hoon. Aapki help karne ke liye ready hoon."
 :"Hello Boss! 😊 I am GURU AI. I am ready to help you.";

 speak(t);
}

function openMemory(){

 let memory=localStorage.getItem("guruMemory")||"No saved memory.";

 showModal(`
 <button class="close" onclick="closeModal()">✕</button>
 <h2>MEMORY</h2>
 <div class="bubble">${memory}</div>
 `);
}

function openSoul(){

 showModal(`
 <button class="close" onclick="closeModal()">✕</button>
 <h2>SOUL</h2>
 <div class="bubble">
 Hello Boss! 😊 Mi GURU AI aahe —
 tumcha friendly smart assistant.
 </div>
 `);
}

function openChat(){

 showModal(`
 <button class="close" onclick="closeModal()">✕</button>
 <h2>CHAT</h2>

 <div class="chatbox" id="chatbox">
  <div class="bubble">
   Hello Boss! 😊 Kay help karu?
  </div>
 </div>

 <div class="chatinput">
  <input id="chatInput" placeholder="Type message...">
  <button onclick="sendChat()">➤</button>
 </div>
 `);
}

function sendChat(){

 let input=document.getElementById("chatInput");
 let text=input.value.trim();

 if(!text)return;

 document.getElementById("chatbox").innerHTML+=
 `<div class="bubble user">${text}</div>`;

 let ans=answer(text);

 document.getElementById("chatbox").innerHTML+=
 `<div class="bubble">${ans}</div>`;

 input.value="";

 if(settings.autoSpeak)speak(ans);
}

document.getElementById("overlay").onclick=e=>{
 if(e.target.id==="overlay")closeModal();
};

</script>

</body>
   </html>
